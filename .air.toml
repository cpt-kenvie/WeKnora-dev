root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "bash ./scripts/air-build.sh"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "migrations", "node_modules", "docs", "logs", "data", "WeKnora-Chrome-Extension", "Formula", "dataset", "docreader", "docker", "llm_debug", "web", "mcp-server", "misc", "scripts", "dist", "client", "helm", "website-docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # 使用 full_bin 来设置环境变量（从父进程继承）
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  # 构建失败时停止运行，避免继续启动旧产物。
  stop_on_error = true

# Windows 版 Air 需显式调用 Git Bash，并运行带 .exe 后缀的产物。
[build.windows]
  cmd = "bash.exe ./scripts/air-build.sh ./tmp/main.exe"
  bin = "./tmp/main.exe"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

[cmd]
  # 重启前执行的清理命令
  stop = "sudo lsof -t -i :18080 | xargs -r sudo kill -9"